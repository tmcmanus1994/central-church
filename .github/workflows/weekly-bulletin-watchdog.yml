name: Weekly bulletin update — watchdog

# Every recorded failure of the primary workflow, going back to this
# automation's first week, has been the same thing: it runs at 6 AM CT and
# Jessica's bulletin email isn't in the mailbox yet. Not an auth problem, not
# a missed cron — just early. This retries later in the morning whenever the
# day's most recent run didn't succeed, giving the email more time to arrive
# before anyone has to notice and re-run it by hand.
#
# (An earlier version of this watchdog only checked whether a run had
# happened at all, which missed this exact failure mode, and its GitHub API
# call had a bug — passing `-f` to `gh api` switches it to POST unless told
# otherwise, so every single run of that version 404'd before it could check
# anything. Fixed both here.)
on:
  schedule:
    - cron: "0 14 * * SUN"
    - cron: "0 17 * * SUN"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check today's most recent run of weekly-bulletin.yml
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          conclusion=$(gh api --method GET \
            "repos/${{ github.repository }}/actions/workflows/weekly-bulletin.yml/runs" \
            -f "created=>=${today}T00:00:00Z" \
            -f "per_page=1" \
            --jq '.workflow_runs[0].conclusion // "missing"')
          echo "Most recent run today: $conclusion"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Retry — no successful run yet today
        if: steps.check.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weekly-bulletin.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
