name: Weekly bulletin update

on:
  schedule:
    # ~6 AM CDT / 5 AM CST — hours of buffer before the 9:15 service, and
    # well after Jessica's bulletin email typically goes out Saturday.
    - cron: "0 11 * * SUN"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # google-auth/google-api-python-client replaced imaplib: a static app
      # password logging in from a different GitHub-assigned cloud region
      # on basically every run kept getting silently flagged as suspicious
      # by Google's account-safety system. OAuth doesn't hit that trip-wire
      # — see automation/get_refresh_token.py for the one-time setup.
      - run: pip install html2text google-auth google-api-python-client

      # inbox/ is gitignored and only ever lives on this runner's disk for
      # the few minutes this job runs — the PDF and email both carry things
      # (named prayer requests, giving figures, phone numbers) that don't
      # belong in git history.
      - name: Ingest this week's bulletin email
        id: ingest
        run: python automation/ingest.py
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}

      # ingest.py reports *why* it failed via failure_reason, because the two
      # causes need opposite responses: a revoked token needs a human to
      # re-mint it (nothing will fix itself), while a missing email usually
      # just needs the watchdog's later retry. One generic issue hid that
      # difference and cost a week in October 2026.
      - name: Alert on failed ingest
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_REASON: ${{ steps.ingest.outputs.failure_reason }}
        run: |
          # One issue per problem, not one per attempt: with the watchdog
          # retrying and a human re-running by hand, a dead token filed four
          # identical issues in twelve hours on 2026-10-11/12.
          if [ "$FAILURE_REASON" = "auth" ]; then
            existing=$(gh issue list --state open --search "Gmail OAuth token revoked in:title" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "Token-revoked issue #$existing is already open — not filing another."
              exit 0
            fi
            gh issue create \
              --title "Gmail OAuth token revoked — bulletin automation needs a new refresh token ($(date +%F))" \
              --body "Gmail rejected the automation's OAuth refresh token (invalid_grant: expired or revoked). This is not a missing email — every run will fail the same way until the token is replaced, and the watchdog's retries won't help.

          Likely causes, in order: the automation mailbox's password was changed (Google revokes all Gmail-scoped tokens when that happens), Google's account-safety system locked/restored the account again, or the app was removed under Google Account -> Security -> Third-party access.

          To fix:
          1. On your own computer: python3 automation/get_refresh_token.py <path to client_secret JSON>
          2. Sign in as the automation mailbox and click Allow.
          3. Paste the printed GMAIL_OAUTH_REFRESH_TOKEN into GitHub -> Settings -> Secrets and variables -> Actions (replace the existing one).
          4. Re-run this workflow: Actions tab -> Weekly bulletin update -> Run workflow.

          Full steps are in automation/README.md under One-time setup."
          else
            gh issue create \
              --title "No bulletin email found for $(date +%F)" \
              --body "The weekly agent looked for this week's bulletin email (from jessica@arcentralchurch.org) in the automation mailbox and didn't find one. Nothing was changed on the site. The watchdog retries later in the morning on its own, so no action is needed unless it's still missing by the afternoon.

          Then check:
          - Did Jessica send this week's bulletin email yet?
          - Is the Gmail filter still forwarding jessica@arcentralchurch.org to the automation mailbox?
          - Re-run this workflow manually once it's there: Actions tab -> Weekly bulletin update -> Run workflow."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Configure git identity for the agent's commits
        run: |
          git config --global user.name "central-bulletin-bot"
          git config --global user.email "bot@users.noreply.github.com"

      - name: Run the update agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "Read automation/AGENT.md and execute this week's update run."
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this, every Bash call (git, gh, node scripts/import-bulletin.mjs)
          # sits waiting for an interactive approval that can never come in
          # CI and gets auto-denied — confirmed in run #8's permission_denials.
          # AGENT.md's own hard rules (never push to the default branch,
          # only touch the two content files, stop on failure) are the real
          # safety boundary here, not tool-approval prompts.
          # 40 wasn't enough for a real content week: run #10 (2026-08-01) got
          # all the way through parsing the PDF and editing both content files
          # and was killed one step from done, mid-way through writing the run
          # summary, before it could commit/push/open the PR. Nothing was
          # committed since it never got that far — bumped for headroom.
          claude_args: "--max-turns 80 --allowedTools \"Bash Read Edit Write Glob Grep\""
          # Temporary while we're debugging the first few runs — shows the
          # actual failure reason instead of a redacted summary. Safe to
          # drop back out once this is running cleanly week to week.
          show_full_output: true
        env:
          GH_TOKEN: ${{ github.token }}

      # Travelle's own call (2026-10-06): auto-merge every week's PR, not
      # just ones the agent marks routine — he's seen enough weeks of this
      # running correctly to drop the human-review fallback entirely. The
      # agent's "Safe to auto-merge: yes/no" verdict (AGENT.md step 9) is
      # still logged below for visibility into which weeks it considered
      # routine, but it no longer gates the merge — only the independent
      # build check does. Turn off anytime by setting auto_merge_enabled to
      # false in automation/config.json — no code change needed.
      - name: Auto-merge this week's PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r '.auto_merge_enabled // false' automation/config.json)" != "true" ]; then
            echo "Auto-merge is off in automation/config.json — leaving any PR for human review."
            exit 0
          fi

          branch="bulletin/$(date +%F)"
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR on $branch — nothing to auto-merge."
            exit 0
          fi

          verdict=$(gh pr view "$pr_number" --json body --jq '.body' | grep -i '^Safe to auto-merge:' | tail -n1)
          echo "Agent's verdict (informational only, does not gate the merge): ${verdict:-<none found>}"

          echo "Verifying the build independently before merging..."
          git fetch origin "$branch"
          git checkout "$branch"
          npx tsc --noEmit
          npm run build

          echo "Build verified — merging PR #$pr_number."
          gh pr merge "$pr_number" --merge --delete-branch
